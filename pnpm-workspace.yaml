allowBuilds:
  # Reviewed postinstall helper required by the patched protobufjs runtime.
  "protobufjs@7.6.5": true
blockExoticSubdeps: true
engineStrict: true
minimumReleaseAge: 10080
# Prune exceptions for versions absent from the lockfile; age expiry is reviewed separately.
minimumReleaseAgeExcludePrune: true
nodeLinker: hoisted
overrides:
  # Pulumi runs precompiled JavaScript; omit its unused optional TypeScript runner.
  "@pulumi/pulumi@3.274.1>ts-node": "-"
  # These exact releases declare rimraf but never reference it in published code.
  # Remove the unused edges to eliminate glob/minimatch DoS advisories
  # GHSA-3g3m-2fjr-6pw4 and GHSA-g3hv-75wg-m249 without cross-major replacements.
  # Recheck these removals when either parent version changes.
  "google-gax@5.0.8>rimraf": "-"
  "gaxios@7.1.3>rimraf": "-"
  "@grpc/grpc-js@<1.8.22": "1.14.5"
  "@grpc/grpc-js@>=1.12.0 <1.12.7": "1.14.5"
  "@protobufjs/utf8@<1.1.1": "^1.1.1"
  "@sigstore/core@<=3.2.0": "^3.2.1"
  "brace-expansion@>=2.0.0 <5.0.8": "5.0.12"
  "cross-spawn@<7.0.5": "^7.0.5"
  "diff@>=4.0.0 <4.0.4": "^4.0.4"
  "glob@<10.5.0": "^10.5.0"
  "google-gax>@grpc/grpc-js": "1.14.5"
  "http-cache-semantics@<=4.2.0": "4.3.0"
  "ip-address@<=10.7.3": "10.7.4"
  "js-yaml@>=4.0.0 <4.3.2": "4.3.2"
  "jws@<4.0.1": "^4.0.1"
  "linkify-it@>=5.0.0 <5.0.2": "^5.0.2"
  "lodash@<4.18.0": "^4.18.0"
  "markdown-it@<14.1.1": "^14.1.1"
  "markdown-it@<=14.1.1": "^14.2.0"
  "markdown-it@>=14.2.0 <14.3.3": "14.3.3"
  "minimatch@<9.0.7": "^9.0.7"
  "node-forge@<1.4.0": "^1.4.0"
  "pacote@<21.5.1": "^21.5.1"
  "picomatch@<3.0.2": "^3.0.2"
  "postcss-selector-parser@<7.1.6": "7.1.6"
  "tinyglobby@0.2.15>picomatch@>=4.0.0": "^3.0.2"
  "protobufjs@>=7.0.0 <7.6.5": "^7.6.5"
  "protobufjs-cli@<1.2.1": "^1.2.1"
  "protobufjs-cli@<=1.3.2": "^1.3.3"
  "sigstore@<=4.1.0": "^4.1.1"
  "tar@>=7.0.0 <7.5.21": "^7.5.21"
  "tmp@<0.2.6": "^0.2.6"
  "underscore@<1.13.8": "^1.13.8"
preferFrozenLockfile: true
strictDepBuilds: true
trustLockfile: false
trustPolicy: no-downgrade
trustPolicyExclude:
  # User-approved: this existing Node types dependency lacks publishing provenance.
  # Remove when @types/node accepts a version that passes the trust policy.
  - "undici-types@6.19.8"
